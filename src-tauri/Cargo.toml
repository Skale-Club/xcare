[package]
name = "xcare"
version = "0.1.1"
description = "Xcare: portable PC cleaner and optimizer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
minisign-verify = "0.2"
base64 = "0.22"
wmi = "0.13"
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
