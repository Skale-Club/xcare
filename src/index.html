<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xcare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="side">
    <div class="brand">
      <img src="logo.png" alt="">
      <div>
        <b>Xcare</b>
        <small data-t="tagline"></small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
      </select>
      <span class="ver"></span>
    </div>
  </aside>
  <main>
    <div id="update-bar" hidden></div>
    <header>
      <h1 id="title"></h1>
      <span id="admin-badge"></span>
    </header>
    <div id="page"></div>
  </main>
  <div id="modal" hidden>
    <div class="dialog">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div class="dialog-actions">
        <button id="modal-cancel" class="btn"></button>
        <button id="modal-ok" class="btn primary"></button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
